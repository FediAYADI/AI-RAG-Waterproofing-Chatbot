# AI RAG Waterproofing Chatbot Configuration

app:
  name: "AI RAG Waterproofing Chatbot"
  version: "1.0.0"
  description: "RAG-based chatbot for waterproofing consultation"
  debug: false

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/app.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

database:
  url: "sqlite:///./data/chatbot.db"
  echo: false

vector_db:
  type: "chromadb"  # chromadb, faiss, pinecone
  path: "./data/vector_store"
  collection_name: "waterproofing_docs"
  dimension: 384

pinecone:
  api_key: "${PINECONE_API_KEY}"
  environment: "${PINECONE_ENVIRONMENT}"
  index_name: "waterproofing-chatbot"

embedding:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  provider: "huggingface"
  batch_size: 100
  dimension: 384

llm:
  provider: "local"  # openai, anthropic, local
  model: "microsoft/phi-2"
  temperature: 0.7
  max_tokens: 500
  streaming: false

rag:
  chunk_size: 1000
  chunk_overlap: 200
  top_k_retrieval: 5
  retrieval_strategy: "similarity"  # similarity, mmr, hybrid
  rerank: false
  rerank_model: "cross-encoder"

processing:
  max_file_size: 10485760  # 10MB
  allowed_extensions:
    - ".pdf"
    - ".txt"
    - ".docx"
    - ".md"
    - ".csv"
    - ".xls"
    - ".xlsx"
  clean_text: true
  remove_stopwords: false

cache:
  enabled: true
  ttl: 3600  # 1 hour
  backend: "memory"  # memory, redis

redis:
  host: "localhost"
  port: 6379
  db: 0
  password: null

monitoring:
  enabled: true
  metrics_port: 9090
  trace_enabled: false
