<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website with Waterproofing Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        .navbar {
            background: #333;
            color: white;
            padding: 20px;
        }
        
        .content {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: #333;
        }
    </style>
</head>
<body>
    <!-- Your existing website content -->
    <nav class="navbar">
        <h2>Your Website</h2>
    </nav>
    
    <div class="content">
        <h1>Welcome to Your Website</h1>
        <p>This is your existing website content. The chatbot widget will appear in the bottom-right corner.</p>
        
        <h2>About Waterproofing</h2>
        <p>Add your waterproofing content here...</p>
    </div>

    <!-- Embed the chatbot widget -->
    <script src="chat-widget.js"></script>
    <script>
        // Initialize the chatbot
        WaterproofingChatbot.init({
            apiUrl: 'http://localhost:8000/api/v1',  // Your backend API URL
            position: 'bottom-right',                 // or 'bottom-left'
            primaryColor: '#007bff',                   // Customize color
            title: 'Waterproofing Assistant',          // Widget title
            placeholder: 'Ask about waterproofing...'  // Input placeholder
        });
    </script>
</body>
</html>
